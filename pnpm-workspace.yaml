packages:
  - packages/*

# pnpm blocks postinstall scripts unless a package is listed here. These are all
# native-binary installers pulled in transitively; without this they are silently
# skipped and fail later at build time rather than at install.
allowBuilds:
  '@swc/core': true
  esbuild: true

# Supply-chain soak: no dependency may be installed until it has been on the registry
# for 24h. This is the control that stops a compromised release from being pulled into
# a build within hours of publication.
#
# It must live here. In `.npmrc`, `minimumreleaseage` is not a valid key - it never
# reaches pnpm's typed config and the soak is silently inert.
#
# `minimumReleaseAgeStrict` is required for it to mean anything. Without it pnpm runs
# LOOSE: a too-young package is not rejected, it is appended to
# `minimumReleaseAgeExclude` and installed anyway, so the soak excuses itself on every
# install and the waiver list grows on its own. Strict turns that into a hard
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION.
#
# There is deliberately no exclusion list. If an install trips the gate, prefer waiting
# it out or pinning an older mature version; an exclusion is a dated exception that
# should carry its reason and the date it becomes removable.
minimumReleaseAge: 1440 # 1 day
minimumReleaseAgeStrict: true

# First-party packages are exempt from the soak.
#
# The soak exists to stop a COMPROMISED THIRD-PARTY release being pulled into a build
# within hours of publication. It does not describe our own packages: we control what
# goes into them, and a first-party release is reviewed before it is published, not
# after. Applying it to ourselves only means a fresh publish is invisible to the next
# repo in the chain for 24h.
#
# That cost is real, not theoretical. It is what produced the type-plus duplication in
# this repo: assertron@11.6.0 (type-plus ^8.0.0-beta.10, tersify ^4.0.6) was too young,
# so pnpm silently resolved 11.5.2 instead and dragged in type-plus 7.6.2 and
# tersify 3.12.1 alongside the 8.x this package now pins.
minimumReleaseAgeExclude:
  - assertron
  - satisfier
  - tersify
  - unpartial
  - type-plus
  - path-equal
  - iso-error
  - iso-error-web
  - iso-error-google-cloud-api
  - standard-log
  - standard-log-color
  - async-fp
  - fsa-emitter
  - progress-str
  - clibuilder
  - args-minus
  - global-store
  - stable-store
  - mocktomata
  - just-func
  - storybook-addon-vis
  - vitest-plugin-vis
  - node-supported-releases
  - '@just-func/*'
  - '@just-web/*'
  - '@mocktomata/*'
  - '@repobuddy/*'
  - '@unional/*'
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11
